services:
  couple-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: couple-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    entrypoint: ["/sbin/tini", "--"]
    command: >
      sh -c "
        mkdir -p /app/data/photos &&
        chown -R node:node /app/data &&
        exec node bot.js
      "